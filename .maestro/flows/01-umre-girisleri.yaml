appId: ${APP_ID}
name: Umre hazırlık ve yolculuk girişleri
---
- launchApp
- assertVisible: "Hac ve Umre Sesli Rehber"
- scrollUntilVisible:
    element: "(?s)Umreye hazırlanıyorum.*"
    direction: DOWN
- tapOn:
    text: "(?s)Umreye hazırlanıyorum.*"
    retryTapIfNoChange: true
- assertVisible: "Umre · Öğrenme"
- scrollUntilVisible:
    element: "Kaldığım başlığa git"
    direction: DOWN
- tapOn: "Kaldığım başlığa git"
- assertVisible: "(?s)İçerik hazırlanıyor.*"
- takeScreenshot: umre-taslak-adim
- launchApp
- scrollUntilVisible:
    element: "(?s)Umredeyim.*"
    direction: DOWN
- tapOn:
    text: "(?s)Umredeyim.*"
    retryTapIfNoChange: true
- assertVisible: "Umre · Yolculukta rehber"
- scrollUntilVisible:
    element: "Yeni yolculuk kaydı aç"
    direction: DOWN
- assertVisible: "Yeni yolculuk kaydı aç"
- takeScreenshot: umre-yolculuk
