appId: ${APP_ID}
name: Rehberde sentetik taslak ses durumu
---
- launchApp
- scrollUntilVisible:
    element: "(?s)^Rehbere başla.*"
    direction: UP
- scrollUntilVisible:
    element: "(?s)Umre.*18 başlık.*"
    direction: DOWN
- tapOn:
    text: "(?s)Umre.*18 başlık.*"
    retryTapIfNoChange: true
- assertVisible: "Umre · kullanım biçimi"
- tapOn: "(?s)Öğrenme.*Başlıkları serbestçe incele.*"
- assertVisible: "Umre · Öğrenme"
- scrollUntilVisible:
    element: "(?s).*Kullanım biçimi seçimi.*İçerik: Taslak.*"
    direction: DOWN
- tapOn: "(?s).*Kullanım biçimi seçimi.*İçerik: Taslak.*"
- scrollUntilVisible:
    element: "Sentetik taslak kayıt. Dinî, dil ve kullanım hakkı incelemesi tamamlanmadı."
    direction: DOWN
- assertVisible: "Sentetik taslak kayıt. Dinî, dil ve kullanım hakkı incelemesi tamamlanmadı."
- takeScreenshot: rehber-sentetik-taslak-ses

- scrollUntilVisible:
    element: "Anlatımı dinle"
    direction: DOWN
- tapOn: "Anlatımı dinle"
- extendedWaitUntil:
    visible: "Duraklat"
    timeout: 15000
- tapOn: "Duraklat"
- assertVisible: "Ses duraklatıldı"
- tapOn: "Devam et"
- assertVisible: "Duraklat"
- scrollUntilVisible:
    element: "10 sn ileri"
    direction: DOWN
- tapOn: "10 sn ileri"
- tapOn: "10 sn geri"
- tapOn: "Anlatım hızı · 1.0×"
- tapOn: "1.25×"
- assertVisible: "Anlatım hızı · 1.25×"
- scrollUntilVisible:
    element: "Sesi durdur"
    direction: DOWN
- tapOn: "Sesi durdur"
- assertVisible: "Anlatımı dinle"
- takeScreenshot: gercek-paketli-taslak-anlatim

- tapOn: "Anlatımı dinle"
- extendedWaitUntil:
    visible: "Duraklat"
    timeout: 15000
- scrollUntilVisible:
    element: "Sonraki başlık"
    direction: DOWN
- tapOn: "Sonraki başlık"
- scrollUntilVisible:
    element: "U01 · 2 / 18"
    direction: UP
- assertVisible: "U01 · 2 / 18"
- assertVisible: "Hazırlık"
- scrollUntilVisible:
    element: "Anlatımı dinle"
    direction: DOWN
- assertVisible: "Anlatımı dinle"
- assertNotVisible: "Sesi durdur"
- takeScreenshot: adim-degisince-eski-anlatim-durur
