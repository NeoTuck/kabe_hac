appId: ${APP_ID}
name: İlk kullanımda gerçek cihaz paket durumu
---
- launchApp
- extendedWaitUntil:
    visible: "Rehbere başla"
    timeout: 30000
- scrollUntilVisible:
    element: "Yolculuğa hazır mıyım?"
    direction: DOWN
- tapOn: "Yolculuğa hazır mıyım?"
- assertVisible: "Yolculuğa hazır mıyım?"
- scrollUntilVisible:
    element: "Harita paketlerine git"
    direction: DOWN
- assertVisible: "(?s).*Yer kayıtları:.*cihazda.*"
- scrollUntilVisible:
    element: "(?s).*19 / 20 ses dosyası cihazda.*"
    direction: DOWN
- assertVisible: "(?s).*19 / 20 ses dosyası cihazda.*"
- scrollUntilVisible:
    element: "Rehber ve ses paketlerine git"
    direction: DOWN
- assertVisible: "(?s).*izinli ses dosyası doğrulandı.*"
- tapOn: "Rehber ve ses paketlerine git"
- assertVisible: "Rehber ve izinli ses paketleri"
- takeScreenshot: hazirlik-paket-durumu
