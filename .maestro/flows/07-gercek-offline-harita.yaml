appId: ${APP_ID}
name: Gerçek paket indirme ve yerel harita renderı
---
- launchApp
- scrollUntilVisible:
    element: "(?s)Çevrimdışı paketleri yönet.*"
    direction: DOWN
- tapOn: "(?s)Çevrimdışı paketleri yönet.*"
- scrollUntilVisible:
    element: "Mekke haritasını indir"
    direction: DOWN
- tapOn: "Mekke haritasını indir"
- extendedWaitUntil:
    visible: "Mekke çevrimdışı haritası indirildi ve dosyaları doğrulandı. Açıp kontrol edebilirsin."
    timeout: 90000
- scrollUntilVisible:
    element: "Dosyalar doğrulandı"
    direction: DOWN
- assertVisible: "Dosyalar doğrulandı"
- launchApp
- tapOn: "(?s)Yolculuk.*"
- tapOn: "Çevrimdışı haritayı aç"
- assertVisible: "Çevrimdışı şehir haritası"
- extendedWaitUntil:
    visible: "Harita hazır · Çevrimdışı"
    timeout: 30000
- assertVisible: "Harita hazır · Çevrimdışı"
- takeScreenshot: gercek-mekke-haritasi

- tapOn: "Haritada yer bul"
- tapOn: "Yer türü"
- tapOn: "Eczane"
- tapOn: "Filtreyi haritada göster"
- assertVisible: "(?s).*yer · Eczane.*"
- tapOn: "Filtreleri temizle"
- assertNotVisible: "Filtreleri temizle"
- takeScreenshot: ortak-kategori-filtresi
