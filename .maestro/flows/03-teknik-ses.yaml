appId: ${APP_ID}
name: Teknik ses oynatma ve duraklatma
---
- launchApp
- scrollUntilVisible:
    element:
      text: "(?s)Ses (ve Arapça örnek kartını aç|örneğine kaldığım yerden devam).*"
    direction: DOWN
- tapOn:
    text: "(?s)Ses (ve Arapça örnek kartını aç|örneğine kaldığım yerden devam).*"
- assertVisible: "Teknik örnek kart"
- scrollUntilVisible:
    element: "Anlatımı dinle"
    direction: DOWN
# The synthetic demo is 30 seconds; a native driver may spend several seconds
# locating a moving screen. Still limit settling and require actual pause.
- tapOn:
    text: "Anlatımı dinle"
    waitToSettleTimeoutMs: 500
- assertVisible: "Duraklat"
- tapOn:
    text: "Duraklat"
    waitToSettleTimeoutMs: 500
- assertVisible: "Anlatımı dinle"
- assertVisible: "Ses duraklatıldı"
- takeScreenshot: teknik-ses-duraklatildi
