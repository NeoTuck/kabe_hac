name: MVP checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/qa-requirements.txt
      - run: python tools/verify_mobile_qa.py
      - run: python tools/content_audit.py
      - run: python -m py_compile tools/run_mobile_qa.py tools/verify_mobile_qa.py tools/content_audit.py
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev ffmpeg
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
        env:
          MVP_CAPTURE_UI: true
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: docs/mvp-ui/*.png
          if-no-files-found: error
      - run: python3 tools/verify_audio.py
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-pilot
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16-pgtap ripgrep
      - run: npm install --prefix /tmp/kabe-pglite @electric-sql/pglite@0.5.8
      - run: |
          export PGTAP_SQL="$(rg --files /usr/share/postgresql/16/extension | rg '/pgtap--[0-9.]+\.sql$' | sort -V | tail -1)"
          node supabase/tests/standalone/run.cjs
        env:
          NODE_PATH: /tmp/kabe-pglite/node_modules
  android-ui:
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-pilot
          path: build/app/outputs/flutter-apk
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d /tmp/maestro-cli
          echo '/tmp/maestro-cli/maestro/bin' >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb -s emulator-5554 install build/app/outputs/flutter-apk/app-debug.apk
            python tools/run_mobile_qa.py --platform android --device emulator-5554 --test-device --flow all
      - name: Preserve device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-api-${{ matrix.api }}
          path: build/mobile-qa
          if-no-files-found: warn
  android-release-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: python3 tools/report_apk_sizes.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-optimized-technical-pilot
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/apk-size-report.json
          if-no-files-found: error
