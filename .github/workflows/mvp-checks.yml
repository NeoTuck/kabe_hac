name: MVP checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/qa-requirements.txt
      - name: Recording integrity decoder
        run: |
          timeout 180s sudo apt-get -o Acquire::Retries=2 update
          timeout 600s sudo apt-get -o Acquire::Retries=2 install --no-install-recommends -y ffmpeg
      - run: python tools/verify_mobile_qa.py
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/content_audit.py
      - run: python -m py_compile tools/run_mobile_qa.py tools/verify_mobile_qa.py tools/content_audit.py tools/build_offline_manifest.py tools/release_preflight.py
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 platforms;android-36 build-tools;36.0.0
      - name: Refresh test dependency index with bounded network retries
        run: timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - name: Install test dependencies with bounded network retries
        run: timeout 600s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y libsqlite3-dev ffmpeg
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
        env:
          MVP_CAPTURE_UI: true
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: docs/mvp-ui/*.png
          if-no-files-found: error
      - run: python3 tools/verify_audio.py
      - run: flutter build apk --debug
      - run: python3 tools/verify_production_assets.py build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-pilot
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - run: python3 tools/build_audio_probe.py --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: android-audio-qa-only
          path: build/audio-qa/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.4', '26.2']
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Record selected SDK and toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
      - name: Unsigned release compilation with current store SDK
        if: matrix.xcode == '26.2'
        run: flutter build ios --release --no-codesign
      - run: flutter build ios --simulator --debug
      - run: python3 tools/build_audio_probe.py --platform ios-simulator
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d /tmp/maestro-cli
          echo '/tmp/maestro-cli/maestro/bin' >> "$GITHUB_PATH"
      - run: python3 tools/run_ci_ios_qa.py
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      - name: Preserve simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-ui-${{ matrix.xcode }}
          path: build/mobile-qa
          if-no-files-found: warn
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16-pgtap ripgrep
      - run: npm install --prefix /tmp/kabe-pglite @electric-sql/pglite@0.5.8 pg@8.16.3
      - run: node --test supabase/functions/group-push/core.test.mjs
      - run: node supabase/tests/standalone/server.cjs
        env:
          NODE_PATH: /tmp/kabe-pglite/node_modules
      - name: Real PostgreSQL concurrent cancellation and queue leases
        run: |
          sudo service postgresql start
          sudo -u postgres createdb kabe_concurrency
          mkdir -p /tmp/kabe-pg-concurrency/tests
          cp -R supabase/migrations /tmp/kabe-pg-concurrency/
          cp -R supabase/tests/standalone /tmp/kabe-pg-concurrency/tests/
          chmod -R a+rX /tmp/kabe-pg-concurrency /tmp/kabe-pglite
          sudo -u postgres env GITHUB_ACTIONS=true NODE_PATH=/tmp/kabe-pglite/node_modules node /tmp/kabe-pg-concurrency/tests/standalone/concurrency.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check supabase/functions/group-push/index.ts supabase/functions/location-cleanup/index.ts
      - run: |
          export PGTAP_SQL="$(rg --files /usr/share/postgresql/16/extension | rg '/pgtap--[0-9.]+\.sql$' | sort -V | tail -1)"
          node supabase/tests/standalone/run.cjs
        env:
          NODE_PATH: /tmp/kabe-pglite/node_modules
  android-ui:
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: google_apis
          - api: 35
            target: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-pilot
          path: build/app/outputs/flutter-apk
      - uses: actions/download-artifact@v4
        with:
          name: android-audio-qa-only
          path: build/audio-qa
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d /tmp/maestro-cli
          echo '/tmp/maestro-cli/maestro/bin' >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb -s emulator-5554 install build/app/outputs/flutter-apk/app-debug.apk
            python tools/run_mobile_qa.py --platform android --device emulator-5554 --test-device --flow all --expected-apk build/app/outputs/flutter-apk/app-debug.apk
            adb -s emulator-5554 install -r build/audio-qa/app-debug.apk
            python tools/run_mobile_qa.py --platform android --device emulator-5554 --test-device --flow audio --expected-apk build/audio-qa/app-debug.apk
      - name: Preserve device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-api-${{ matrix.api }}
          path: build/mobile-qa
          if-no-files-found: warn
  android-release-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 platforms;android-36 build-tools;36.0.0
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
        env:
          KABE_TECHNICAL_PILOT: 'true'
      - run: python3 tools/verify_production_assets.py build/app/outputs/flutter-apk/app-*-release.apk
      - run: python3 tools/report_apk_sizes.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-optimized-technical-pilot
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/apk-size-report.json
          if-no-files-found: error
